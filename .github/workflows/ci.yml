name: CI - Continuous Integration

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,studio]"

      - name: Run automated test suite
        run: |
          python -m pytest tests/ -v

      - name: Build distribution packages
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Verify clean wheel installation
        shell: bash
        run: |
          python -m venv test_env
          if [ "${{ runner.os }}" = "Windows" ]; then
            source test_env/Scripts/activate
          else
            source test_env/bin/activate
          fi
          pip install dist/*.whl
          hakai --version
          hakai --help
          hpm --help
          hakai run examples/hello.hakai
          hakai run examples/modules.hakai
          hakai build examples/hello.hakai -o test_hello.hbc
          hakai run test_hello.hbc

