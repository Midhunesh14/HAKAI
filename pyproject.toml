[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hakai-lang"
version = "1.0.0"
description = "The HAKAI Programming Language - Independent compiler, interpreter, VM and IDE"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "HAKAI Language Architecture Team"}
]
dependencies = [
    "PySide6>=6.6.0",
]

[project.scripts]
hakai = "cli.commands:main"
hpm = "package_manager.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

